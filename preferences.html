<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="偏好设置">
    <title>偏好设置</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="api-client.js" defer></script>
    <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/html-midi-player@1.5.0" defer></script>
    <script src="preferences.js" defer></script>
</head>
<body>
    <div class="global-bg" aria-hidden="true"></div>
    <div class="wrap">
        <header>
            <div class="brand" aria-hidden="false">
                <h1>EMMA-Q</h1>
                <p>基于脑电波的智能音乐创作平台</p>
            </div>
            <nav aria-label="主导航">
                <a class="btn" href="welcome.html">返回首页</a>
            </nav>
        </header>

        <main>
            <section class="hero" aria-labelledby="genre-title">
                <canvas id="bgCanvas" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h2 id="genre-title" class="title">偏好设置</h2>
                    <p class="subtitle">根据您的喜好调整音乐生成选项。</p>
                    <div class="actions">
                        <div class="preferences-form">
                            <div class="field full-width">
                                <label for="eeg-file">导入 EEG 数据（CSV）</label>
                                <div id="drop-zone" class="drop-zone" aria-label="拖拽或选择文件上传">
                                    <span class="drop-zone__label">拖拽文件到此处<br/>或选择本地文件</span>
                                    <input type="file" id="eeg-file" accept=".csv" />
                                </div>
                                <p class="note">支持 .csv 文件，仅支持单个文件上传。</p>
                                <div class="field-error" id="eeg-file-error"></div>
                            </div>

                            <div class="field">
                                <label for="start-time">开始时间 (秒):</label>
                                <input type="number" id="start-time" min="0" max="120" value="0"/>
                                <div class="field-error" id="start-time-error"></div>
                            </div>

                            <div class="field">
                                <label for="duration">时长 (秒):</label>
                                <input type="number" id="duration" min="30" max="120" value="30"/>
                                <div class="field-error" id="duration-error"></div>
                            </div>

                            <div class="field">
                                <label for="sampling-rate">目标采样率 (Hz): <span id="sampling-rate-value">64</span></label>
                                <input type="range" id="sampling-rate" min="16" max="128" value="64"/>
                                <div class="field-error" id="sampling-rate-error"></div>
                            </div>

                            <div class="field">
                                <label for="max-points">最大点数：</label>
                                <input type="number" id="max-points" min="1000" max="30000" step="1" value="8000"/>
                                <div class="field-error" id="max-points-error"></div>
                            </div>

                            <div class="field">
                                <label for="melody-channel">主旋律通道: <span id="melody-channel-value">0</span></label>
                                <input type="range" id="melody-channel" min="0" max="6" step="1" value="0" />
                                <div class="field-error" id="melody-channel-error"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

            <section class="hero" aria-labelledby="module2-title">
                <canvas id="bgCanvas2" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h3 id="module2-title" class="section-title">音乐规则</h3>
                    <div class="actions">
                        <div class="preferences-form">
                            <div class="field">
                                <label for="rule">规则：</label>
                                <select id="rule">
                                    <option value="Rule1">Rule1</option>
                                    <option value="Rule2">Rule2</option>
                                </select>
                                <div class="field-error" id="rule-error"></div>
                            </div>

                            <div class="field">
                                <label for="time-signature" >拍号:</label>
                                <select id="time-signature">
                                    <option value="2/4">2/4</option>
                                    <option value="3/4">3/4</option>
                                    <option value="4/4">4/4</option>
                                    <option value="3/8">3/8</option>
                                    <option value="6/8">6/8</option>
                                </select>
                                <div class="field-error" id="time-signature-error"></div>
                            </div>

                            <div class="field">
                                <label for="pitch-center">音域中心: <span id="pitch-center-value">66</span></label>
                                <input type="range" id="pitch-center" min="60" max="72" value="66"/>
                                <div class="field-error" id="pitch-center-error"></div>
                            </div>

                            <div class="field">
                                <label for="span">三档跨度: <span id="span-value">8</span></label>
                                <input type="range" id="span" min="4" max="12" value="8" />
                                <div class="field-error" id="span-error"></div>
                            </div>

                            <div class="field">
                                <label for="span-mode" >三档模式: </label>
                                <select id="span-mode" onchange="document.querySelectorAll('.span-mode-manual-field').forEach(function(field){ var isManual = (this.value||'').toLowerCase() === 'mode2'; field.classList[isManual ? 'remove' : 'add']('is-disabled'); field.setAttribute('aria-disabled', isManual ? 'false' : 'true'); var input = field.querySelector('input'); if (input) { input.disabled = !isManual; } }, this)">
                                    <option value="Mode1">自动（推荐）</option>
                                    <option value="Mode2">手动</option>
                                </select>
                                <div class="field-error" id="span-mode-error"></div>
                            </div>
                            <div class="field span-mode-manual-field is-disabled" aria-disabled="true">
                                <label for="pitch-1">Pitch 1 （高）: </label>
                                <input type="number" id="pitch-1" min="0" max="127" value="74" disabled />
                                <div class="field-error" id="pitch-1-error"></div>
                            </div>
                            <div class="field span-mode-manual-field is-disabled" aria-disabled="true">
                                <label for="pitch-2">Pitch 2 （中）: </label>
                                <input type="number" id="pitch-2" min="0" max="127" value="66" disabled />
                                <div class="field-error" id="pitch-2-error"></div>
                            </div>
                            <div class="field span-mode-manual-field is-disabled" aria-disabled="true">
                                <label for="pitch-3">Pitch 3 （低）: </label>
                                <input type="number" id="pitch-3" min="0" max="127" value="58" disabled />
                                <div class="field-error" id="pitch-3-error"></div>
                            </div>
                            <div class="field">
                                <label for="dynamics-preset">力度预设：</label>
                                <select id="dynamics-preset">
                                    <option value="Light">柔和</option>
                                    <option value="Standard">标准</option>
                                    <option value="Strong">强烈</option>
                                    <option value="Custom">手动</option>
                                </select>
                                <div class="field-error" id="dynamics-preset-error"></div>
                            </div>
                            <div class="field dynamics-manual-field is-disabled" aria-disabled="true">
                                <label for="vel-1">Vel 1:</label>
                                <input type="number" id="vel-1" min="1" max="127" value="90" disabled />
                                <div class="field-error" id="vel-1-error"></div>
                            </div>
                            <div class="field dynamics-manual-field is-disabled" aria-disabled="true">
                                <label for="vel-2">Vel 2:</label>
                                <input type="number" id="vel-2" min="1" max="127" value="70" disabled />
                                <div class="field-error" id="vel-2-error"></div>
                            </div>
                            <div class="field dynamics-manual-field is-disabled" aria-disabled="true">
                                <label for="vel-3">Vel 3:</label>
                                <input type="number" id="vel-3" min="1" max="127" value="55" disabled />
                                <div class="field-error" id="vel-3-error"></div>
                            </div>
                            <div class="field">
                                <label for="magnet">磁力: <span id="magnet-value">4</span></label>
                                <input type="range" id="magnet" min="0" max="12" value="4"/>
                                <div class="field-error" id="magnet-error"></div>
                            </div>
                            <div class="field">
                                <label for="loudness-offset">整体响度偏移: <span id="loudness-offset-value">0</span></label>
                                <input type="range" id="loudness-offset" min="-30" max="30" value="0" />
                                <div class="field-error" id="loudness-offset-error"></div>
                            </div>
                            <div class="field">
                                <label for="dynamics-limit-strategy">力度上限策略：</label>
                                <select id="dynamics-limit-strategy">
                                    <option value="Conservative">保守</option>
                                    <option value="Balanced">平衡</option>
                                    <option value="Aggressive">激进</option>
                                </select>
                                <div class="field-error" id="dynamics-limit-strategy-error"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="hero" aria-labelledby="module3-title">
                <canvas id="bgCanvas3" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h3 id="module3-title" class="section-title">高级参数</h3>
                    <div class="actions">
                        <div class="preferences-form">
                            <div class="field">
                                <label for="rhythm-quantization">节奏量化：</label>
                                <select id="rhythm-quantization">
                                    <option value="Off">Off</option>
                                    <option value="1/8">1/8</option>
                                    <option value="1/16">1/16</option>
                                    <option value="1/32">1/32</option>
                                </select>
                                <div class="field-error" id="rhythm-quantization-error"></div>
                            </div>
                            <div class="field">
                                <label for="swing-amount">摆动程度 <span id="swing-amount-value">0.12</span></label>
                                <input type="range" id="swing-amount" min="0.00" max="0.60" step="0.01" value="0.12" />
                                <div class="field-error" id="swing-amount-error"></div>
                            </div>
                            <div class="field">
                                <label for="note-duration-multiplier">音符时值倍率: <span id="note-duration-multiplier-value">1.2</span></label>
                                <input type="range" id="note-duration-multiplier" min="0.25" max="2.5" step="0.05" value="1.2" />
                                <div class="field-error" id="note-duration-multiplier-error"></div>
                            </div>
                            <div class="field">
                                <label for="sparsity">稀疏化：</label>
                                <select id="sparsity">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                                <div class="field-error" id="sparsity-error"></div>
                            </div>
                            <div class="field">
                                <label for="scale-constraint">音阶约束：</label>
                                <select id="scale-constraint">
                                    <option value="Diatonic">Diatonic</option>
                                    <option value="Chromatic">Chromatic</option>
                                    <option value="Penta">Penta</option>
                                </select>
                                <div class="field-error" id="scale-constraint-error"></div>
                            </div>
                            <div class="field">
                                <label for="pitch-coherence">修音连贯程度：</label>
                                <select id="pitch-coherence">
                                    <option value="None">None</option>
                                    <option value="FX1">FX1</option>
                                    <option value="FX2">FX2</option>
                                    <option value="FX3">FX3</option>
                                    <option value="FX4">FX4</option>
                                </select>
                                <div class="field-error" id="pitch-coherence-error"></div>
                            </div>

                            <div class="field">
                                <label for="pitch-range-min">音域下限 = <span id="pitch-range-min-value">48</span></label>
                                <input type="range" id="pitch-range-min" min="12" max="84" value="48" />
                                <div class="field-error" id="pitch-range-min-error"></div>
                            </div>
                            <div class="field">
                                <label for="pitch-range-max">音域上限 = <span id="pitch-range-max-value">84</span></label>
                                <input type="range" id="pitch-range-max" min="48" max="120" value="84" />
                                <div class="field-error" id="pitch-range-max-error"></div>
                            </div>
                            <div class="field">
                                <label for="max-leap">允许最大跳跃: <span id="max-leap-value">9</span></label>
                                <input type="range" id="max-leap" min="3" max="24" value="9" />
                                <div class="field-error" id="max-leap-error"></div>
                            </div>
                            <div class="field">
                                <label for="transpose">整体转调 半音: <span id="transpose-value">0</span></label>
                                <input type="range" id="transpose" min="-10" max="10" value="0" />
                                <div class="field-error" id="transpose-error"></div>
                            </div>
                            <div class="field">
                                <label for="melody-min-velocity">主旋律最小力度: <span id="melody-min-velocity-value">45</span></label>
                                <input type="range" id="melody-min-velocity" min="30" max="60" value="45" />
                                <div class="field-error" id="melody-min-velocity-error"></div>
                            </div>
                            <div class="field">
                                <label for="melody-max-velocity">主旋律最大力度: <span id="melody-max-velocity-value">90</span></label>
                                <input type="range" id="melody-max-velocity" min="75" max="105" value="90" />
                                <div class="field-error" id="melody-max-velocity-error"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="hero" aria-labelledby="module4-title">
                <canvas id="bgCanvas4" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h3 id="module4-title" class="section-title">和弦设置</h3>
                    <div class="actions">
                        <div class="preferences-form">
                            <div class="field checkbox-field">
                                <input type="checkbox" id="chord-track-enabled" />
                                <label for="chord-track-enabled">附加和弦轨</label>
                                <div class="field-error" id="chord-track-enabled-error"></div>
                            </div>
                            <div class="field">
                                <label for="key-root">调性根音：</label>
                                <select id="key-root">
                                    <option value="Auto">自动</option>
                                    <option value="C">C</option>
                                    <option value="C#">C#</option>
                                    <option value="D">D</option>
                                    <option value="D#">D#</option>
                                    <option value="E">E</option>
                                    <option value="F">F</option>
                                    <option value="F#">F#</option>
                                    <option value="G">G</option>
                                    <option value="G#">G#</option>
                                    <option value="A">A</option>
                                    <option value="A#">A#</option>
                                    <option value="B">B</option>
                                </select>
                                <div class="field-error" id="key-root-error"></div>
                            </div>
                            <div class="field">
                                <label for="major-minor">大小调：</label>
                                <select id="major-minor">
                                    <option value="Auto">自动</option>
                                    <option value="Major">大调</option>
                                    <option value="Minor">小调</option>
                                </select>
                                <div class="field-error" id="major-minor-error"></div>
                            </div>
                            <div class="field">
                                <label for="emotion">情绪：</label>
                                <select id="emotion">
                                    <option value="Calm">平静</option>
                                    <option value="Excited">兴奋</option>
                                    <option value="Sad">伤感</option>
                                    <option value="Tense">紧张</option>
                                </select>
                                <div class="field-error" id="emotion-error"></div>
                            </div>
                            <div class="field">
                                <label for="chord-style">和弦风格：</label>
                                <select id="chord-style">
                                    <option value="Block">Block</option>
                                    <option value="Arp">Arp</option>
                                </select>
                                <div class="field-error" id="chord-style-error"></div>
                            </div>

                            <div class="field">
                                <label for="chord-change-frequency">和弦更换频率: <span id="chord-change-frequency-value">8</span></label>
                                <input type="range" id="chord-change-frequency" min="1" max="32" value="8" />
                                <div class="field-error" id="chord-change-frequency-error"></div>
                            </div>
                            <div class="field">
                                <label for="chord-octave-offset">和弦八度偏移: <span id="chord-octave-offset-value">0</span></label>
                                <input type="range" id="chord-octave-offset" min="-2" max="2" value="0" />
                                <div class="field-error" id="chord-octave-offset-error"></div>
                            </div>
                            <div class="field">
                                <label for="chord-velocity">和弦力度: <span id="chord-velocity-value">55</span></label>
                                <input type="range" id="chord-velocity" min="20" max="90" value="55" />
                                <div class="field-error" id="chord-velocity-error"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section class="hero" aria-labelledby="module5-title">
                <canvas id="bgCanvas5" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h3 id="module5-title" class="section-title">输出与执行</h3>
                    <section id="preferences-summary" class="simple-panel" aria-labelledby="prefs-summary-title">
                        <h3 id="prefs-summary-title">已保存偏好</h3>
                        <p id="prefs-summary" class="simple-note">尚未保存任何偏好。</p>
                    </section>
                    <div class="button-group">
                        <button class="btn save-btn" id="save-prefs" type="button">保存偏好</button>
                        <button class="btn clear-btn" id="clear-prefs" type="button">清除已保存数据</button>
                    </div>
                    <p id="prefs-feedback" class="simple-note" aria-live="polite"></p>
                    <div class="actions">
                        <div class="preferences-form">
                            <div class="button-stack full-width">
                                <button type="button" id="generate-music" class="btn primary-btn">生成 MIDI</button>
                                <button type="button" id="download-midi" class="btn secondary-btn" hidden>下载 MIDI</button>
                                <button type="button" id="start-evaluation" class="btn secondary-btn" disabled>开始评估</button>
                            </div>
                        </div>
                    </div>
                    <section id="runtime-result-panel" class="simple-panel" hidden>
                        <h3>运行结果</h3>
                        <p id="generation-status" class="simple-note">尚未生成 MIDI。</p>
                        <p id="evaluation-status" class="simple-note">尚未开始评估。</p>
                        <div id="midi-player-panel" hidden>
                            <p class="simple-note">生成结果试听</p>
                            <p class="simple-note">点击播放试听当前生成的 MIDI。</p>
                            <midi-player id="midi-player" sound-font style="width:100%;"></midi-player>
                        </div>
                        <ul id="result-links" class="simple-note" hidden></ul>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <script>
        (function(){
            const storageKey = 'simplePrefs';
            const summary = document.getElementById('prefs-summary');
            const feedback = document.getElementById('prefs-feedback');
            const fromEl = document.getElementById('from-genre');
            const elements = {
                eegFile: document.getElementById('eeg-file'),
                dropZone: document.getElementById('drop-zone'),
                startTime: document.getElementById('start-time'),
                duration: document.getElementById('duration'),
                samplingRate: document.getElementById('sampling-rate'),
                samplingRateValue: document.getElementById('sampling-rate-value'),
                maxPoints: document.getElementById('max-points'),
                melodyChannel: document.getElementById('melody-channel'),
                melodyChannelValue: document.getElementById('melody-channel-value'),
                rule: document.getElementById('rule'),
                timeSignature: document.getElementById('time-signature'),
                pitchCenter: document.getElementById('pitch-center'),
                pitchCenterValue: document.getElementById('pitch-center-value'),
                span: document.getElementById('span'),
                spanValue: document.getElementById('span-value'),
                magnet: document.getElementById('magnet'),
                magnetValue: document.getElementById('magnet-value'),
                spanMode: document.getElementById('span-mode'),
                pitch1: document.getElementById('pitch-1'),
                pitch2: document.getElementById('pitch-2'),
                pitch3: document.getElementById('pitch-3'),
                dynamicsPreset: document.getElementById('dynamics-preset'),
                vel1: document.getElementById('vel-1'),
                vel2: document.getElementById('vel-2'),
                vel3: document.getElementById('vel-3'),
                loudnessOffset: document.getElementById('loudness-offset'),
                loudnessOffsetValue: document.getElementById('loudness-offset-value'),
                dynamicsLimitStrategy: document.getElementById('dynamics-limit-strategy'),
                pitchCoherence: document.getElementById('pitch-coherence'),
                scaleConstraint: document.getElementById('scale-constraint'),
                rhythmQuantization: document.getElementById('rhythm-quantization'),
                swingAmount: document.getElementById('swing-amount'),
                swingAmountValue: document.getElementById('swing-amount-value'),
                pitchRangeMin: document.getElementById('pitch-range-min'),
                pitchRangeMinValue: document.getElementById('pitch-range-min-value'),
                pitchRangeMax: document.getElementById('pitch-range-max'),
                pitchRangeMaxValue: document.getElementById('pitch-range-max-value'),
                maxLeap: document.getElementById('max-leap'),
                maxLeapValue: document.getElementById('max-leap-value'),
                transpose: document.getElementById('transpose'),
                transposeValue: document.getElementById('transpose-value'),
                melodyMinVelocity: document.getElementById('melody-min-velocity'),
                melodyMinVelocityValue: document.getElementById('melody-min-velocity-value'),
                melodyMaxVelocity: document.getElementById('melody-max-velocity'),
                melodyMaxVelocityValue: document.getElementById('melody-max-velocity-value'),
                noteDurationMultiplier: document.getElementById('note-duration-multiplier'),
                noteDurationMultiplierValue: document.getElementById('note-duration-multiplier-value'),
                sparsity: document.getElementById('sparsity'),
                chordTrackEnabled: document.getElementById('chord-track-enabled'),
                emotion: document.getElementById('emotion'),
                chordChangeFrequency: document.getElementById('chord-change-frequency'),
                chordChangeFrequencyValue: document.getElementById('chord-change-frequency-value'),
                chordStyle: document.getElementById('chord-style'),
                chordVelocity: document.getElementById('chord-velocity'),
                chordVelocityValue: document.getElementById('chord-velocity-value'),
                chordOctaveOffset: document.getElementById('chord-octave-offset'),
                chordOctaveOffsetValue: document.getElementById('chord-octave-offset-value'),
                keyRoot: document.getElementById('key-root'),
                majorMinor: document.getElementById('major-minor'),
                saveButton: document.getElementById('save-prefs'),
                clearButton: document.getElementById('clear-prefs'),
                generateButton: document.getElementById('generate-music'),
            };
            function formatNumber(num){
                return typeof num === 'number' ? num.toLocaleString() : num;
            }
            const RANGE_LIMITS = {
                pitchRangeMin: { min: 12, max: 84, defaultValue: 48 },
                pitchRangeMax: { min: 48, max: 120, defaultValue: 84 },
            };
            function normalizeOptionValue(v){
                if(v == null) return v;
                if(typeof v !== 'string') return v;
                if(v.length === 0) return v;
                // 如果以字母开头，则首字母大写
                return /^[a-zA-Z]/.test(v) ? v.charAt(0).toUpperCase() + v.slice(1) : v;
            };
            function normalizeScaleConstraint(value){
                const normalized = normalizeOptionValue(value);
                if(normalized === 'Option2') return 'Chromatic';
                if(normalized === 'Option3') return 'Penta';
                return normalized;
            };
            function clampValue(value, min, max, fallback){

                            error = 'Pitch 1 必须在0-127之间';

                        break;
                    case 'pitch-2':
                        const pitch2 = Number(elements.pitch2?.value || 66);
                        if (isNaN(pitch2) || pitch2 < 0 || pitch2 > 127) {
                            error = 'Pitch 2 必须在0-127之间';
                        }
                        break;
                    case 'pitch-3':
                        const pitch3 = Number(elements.pitch3?.value || 58);

                            error = 'Pitch 3 必须在0-127之间';
                        }
                        break;
                    case 'vel-1':

                        if (isNaN(vel1) || vel1 < 1 || vel1 > 127) {
                            error = 'Vel 1 必须在1-127之间';
                        }
                        break;

                        if (isNaN(vel2) || vel2 < 1 || vel2 > 127) {
                            error = 'Vel 2 必须在1-127之间';
                        }
                        break;
                    case 'vel-3':

                            error = 'Vel 3 必须在1-127之间';
                        }
                        break;
                    case 'loudness-offset':

                        if (isNaN(loudnessOffset) || loudnessOffset < -30 || loudnessOffset > 30) {
                            error = '整体响度偏移必须在-30到30之间';
                        }
                        break;
                    case 'swing-amount':
                        const swingAmount = Number(elements.swingAmount?.value || 0.36);
                        if (isNaN(swingAmount) || swingAmount < 0.06 || swingAmount > 0.72) {
                            error = '摆动程度必须在0.06-0.72之间';
                        }
                        break;
                    case 'rhythm-quantization':

                            error = '节奏量化选项无效';

                            error = '音阶约束选项无效';
                        }
                        break;
                    case 'pitch-coherence':
                        const pc = (elements.pitchCoherence?.value || '').toLowerCase();
                        if (!pc) {
                            error = '请选择修音连贯程度';

                            error = '修音连贯程度无效';
                        }
                        break;
                        case 'dynamics-preset':
                            const dp = (elements.dynamicsPreset?.value || '').toLowerCase();
                            if (!dp) {
                                error = '请选择力度预设';

                        case 'emotion':

                                error = '情绪选项无效';

                    case 'pitch-range-min':
                    case 'pitch-range-max':
                        const pitchRangeMin = Number(elements.pitchRangeMin?.value || RANGE_LIMITS.pitchRangeMin.defaultValue);

                        if (fieldId === 'pitch-range-min') {
                            if (isNaN(pitchRangeMin) || pitchRangeMin < RANGE_LIMITS.pitchRangeMin.min || pitchRangeMin > RANGE_LIMITS.pitchRangeMin.max) {
                                error = `音域下限必须在${RANGE_LIMITS.pitchRangeMin.min}-${RANGE_LIMITS.pitchRangeMin.max}之间`;
                            } else if (pitchRangeMin >= pitchRangeMax) {
                                error = '音域下限不能大于或等于音域上限';
                            }
                        } else {
                            if (isNaN(pitchRangeMax) || pitchRangeMax < RANGE_LIMITS.pitchRangeMax.min || pitchRangeMax > RANGE_LIMITS.pitchRangeMax.max) {
                                error = `音域上限必须在${RANGE_LIMITS.pitchRangeMax.min}-${RANGE_LIMITS.pitchRangeMax.max}之间`;
                            } else if (pitchRangeMin >= pitchRangeMax) {
                                error = '音域下限不能大于或等于音域上限';
                            }
                        }
                        break;
                    case 'max-leap':
                        const maxLeap = Number(elements.maxLeap?.value || 9);
                        if (isNaN(maxLeap) || maxLeap < 3 || maxLeap > 24) {
                            error = '允许最大跳跃必须在3-24之间';
                        }
                        break;
                    case 'transpose':
                        const transpose = Number(elements.transpose?.value || 0);
                        if (isNaN(transpose) || transpose < -10 || transpose > 10) {
                            error = '整体转调必须在-10到10之间';
                        }
                        break;
                    case 'melody-min-velocity':
                    case 'melody-max-velocity':
                        const melodyMinVel = Number(elements.melodyMinVelocity?.value || 45);
                        const melodyMaxVel = Number(elements.melodyMaxVelocity?.value || 90);                    
                        if (fieldId === 'melody-min-velocity') {
                            if (isNaN(melodyMinVel) || melodyMinVel < 30 || melodyMinVel > 60) {
                                error = '主旋律最小力度必须在30-60之间';
                            } else if (melodyMinVel >= melodyMaxVel) {
                                error = '主旋律最小力度不能大于或等于最大力度';
                            }
                        } else {
                            if (isNaN(melodyMaxVel) || melodyMaxVel < 75 || melodyMaxVel > 105) {
                                error = '主旋律最大力度必须在75-105之间';
                            } else if (melodyMinVel >= melodyMaxVel) {
                                error = '主旋律最小力度不能大于或等于最大力度';
                            }
                        }
                        break;
                    case 'note-duration-multiplier':
                        const noteDurationMult = Number(elements.noteDurationMultiplier?.value || 1.2);
                        if (isNaN(noteDurationMult) || noteDurationMult < 0.25 || noteDurationMult > 2.5) {
                            error = '音符时值倍率必须在0.25-2.5之间';
                        }
                        break;
                    case 'sparsity':
                        const sparsity = Number(elements.sparsity?.value || 0);
                        if (isNaN(sparsity) || sparsity < 0 || sparsity > 4 || !Number.isInteger(sparsity)) {
                            error = '稀疏化必须是0-4之间的整数';
                        }
                        break;
                    case 'chord-change-frequency':
                        const chordFreq = Number(elements.chordChangeFrequency?.value || 8);
                        if (isNaN(chordFreq) || chordFreq < 1 || chordFreq > 32) {
                            error = '和弦更换频率必须在1-32之间';
                        }
                        break;
                    case 'chord-velocity':
                        const chordVel = Number(elements.chordVelocity?.value || 55);
                        if (isNaN(chordVel) || chordVel < 20 || chordVel > 90) {
                            error = '和弦力度必须在20-90之间';
                        }
                        break;
                    case 'chord-style':
                        const chordStyle = elements.chordStyle?.value || '';
                        if (!chordStyle) {
                            error = '请选择和弦风格';
                        } else if (!['Block', 'Arp'].includes(chordStyle)) {
                            error = '和弦风格选项无效';
                        }
                        break;
                    case 'chord-octave-offset':
                        const chordOctaveOffset = Number(elements.chordOctaveOffset?.value || 0);
                        if (isNaN(chordOctaveOffset) || chordOctaveOffset < -2 || chordOctaveOffset > 2) {
                            error = '和弦八度偏移必须在-2到2之间';
                        }
                        break;
                    case 'key-root':
                        const keyRoot = elements.keyRoot?.value || '';
                        if (!keyRoot) {
                            error = '请选择调性根音';
                        } else if (!['Auto','C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].includes(keyRoot)) {
                            error = '调性根音选项无效';
                        }
                        break;
                        case 'dynamics-limit-strategy':
                            const dyn = (elements.dynamicsLimitStrategy?.value || '').toLowerCase();
                            if (!dyn) {
                                error = '请选择力度上限策略';
                            } else if (!['conservative','balanced','aggressive'].includes(dyn)) {
                                error = '力度上限策略无效';
                            }
                            break;
                }
                return error;
            };
            function updateFieldError(fieldId, error){
                const errorElement = document.getElementById(`${fieldId}-error`);
                if (errorElement) {
                    if (error) {
                        errorElement.textContent = error;
                        errorElement.style.display = 'block';
                    } else {
                        errorElement.textContent = '';
                        errorElement.style.display = 'none';
                    }
                }
            };
            function clearFieldErrors(){
                // 清除所有字段的错误信息
                const errorElements = document.querySelectorAll('.field-error');
                errorElements.forEach(el => {
                    el.textContent = '';
                    el.style.display = 'none';
                });
            };
            function showFieldErrors(errors){
                clearFieldErrors();
                // 显示错误信息
                for (const [fieldId, message] of Object.entries(errors)) {
                    const errorElement = document.getElementById(`${fieldId}-error`);
                    if (errorElement) {
                        errorElement.textContent = message;
                        errorElement.style.display = 'block';
                    }
                }

            function savePrefs(){
                clearFieldErrors();
                if(!hasValidEegFile()){
                    const error = validateField('eeg-file');
                    updateFieldError('eeg-file', error);
                    setFeedback('请先上传 EEG 文件。', true);
                    return;
                }
                try {
                    const prefs = gatherPrefs();
                    localStorage.setItem(storageKey, JSON.stringify(prefs));
                    updateSummary(prefs);
                    setFeedback('偏好已保存。', false);
                    alert('偏好已保存');
                } catch (e) {
                    console.warn('保存偏好失败', e);
                    setFeedback('保存偏好失败，请检查浏览器设置。', true);
                    alert('保存偏好失败，请检查浏览器设置。');
                }
            };

            function toggleSpanModeFields(mode){
                const manualFields = document.querySelectorAll('.span-mode-manual-field');
                const isManual = (mode || '').toString().toLowerCase() === 'mode2';
                if(isManual){
                    manualFields.forEach(field => {
                        field.classList.remove('is-disabled');
                        field.setAttribute('aria-disabled', 'false');
                        const input = field.querySelector('input');
                        if(input) input.disabled = false;
                    });
                } else {
                    manualFields.forEach(field => {
                        field.classList.add('is-disabled');
                        field.setAttribute('aria-disabled', 'true');
                        const input = field.querySelector('input');
                        if(input) input.disabled = true;
                        const errorElements = field.querySelectorAll('.field-error');
                        errorElements.forEach(el => {
                            el.textContent = '';
                            el.style.display = 'none';
                        });
                    });
                }
            };

                    elements.eegFile.addEventListener('change', (event) => {
                        const file = event.target.files?.[0];
                        if(file){
                            elements.eegFile.dataset.fileName = file.name;
                            updateDropZoneLabel(file.name);
                        } else {
                            elements.eegFile.dataset.fileName = '';
                            updateDropZoneLabel('');
                        }
                        const error = validateField('eeg-file');
                        updateFieldError('eeg-file', error);
                        updateActionButtons();
                    });
                }
                if(elements.dropZone){
                    elements.dropZone.addEventListener('dragover', (event) => {
                        event.preventDefault();
                        elements.dropZone.classList.add('dragover');
                    });
                    elements.dropZone.addEventListener('dragleave', () => {
                        elements.dropZone.classList.remove('dragover');
                    });
                    elements.dropZone.addEventListener('drop', (event) => {
                        event.preventDefault();
                        elements.dropZone.classList.remove('dragover');
                        const file = event.dataTransfer?.files?.[0];
                        if(file && file.name.toLowerCase().endsWith('.csv')){
                            if(elements.eegFile){
                                const dataTransfer = new DataTransfer();
                                dataTransfer.items.add(file);
                                elements.eegFile.files = dataTransfer.files;
                                elements.eegFile.dataset.fileName = file.name;
                                updateDropZoneLabel(file.name);
                            }
                        }

                    });
