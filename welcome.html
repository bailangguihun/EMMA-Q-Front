<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="欢迎界面">
    <title>脑电波α计划</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="welcome">
    <div class="wrap">
        <header>
            <div class="brand" aria-hidden="false">
                <h1>EMMA-Q</h1>
                <p>基于脑电波的智能音乐创作平台</p>
            </div>
        </header>
        <main>
            <section class="hero" aria-labelledby="welcome-title">
                <canvas id="bgCanvas" role="img" aria-hidden="true"></canvas>
                <div class="hero-content">
                    <h2 id="welcome-title" class="title">脑韵共创：基于脑电情绪解码的可解释音乐表达与创作意图解析研究</h2>
                    <!-- <p class="subtitle">探索脑电信号与音乐的创造性结合。</p> -->
                    <div class="actions">
                        <a class="btn" href="preferences.html" id="enter-btn">开始创作</a>
                        <a class="btn secondary" href="about.html">了解更多</a>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            开发团队 脑电波ɑ计划 <br/>中国传媒大学 李依桐 卜靖航 陈为 支殿畅 公衍浩
        </footer>
    </div>
    <script>
        // Canvas 背景：绘制动态波形，响应窗口尺寸
        (function(){
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, t = 0;
            function resize(){
                const rect = canvas.getBoundingClientRect();
                canvas.width = Math.round(rect.width * devicePixelRatio);
                canvas.height = Math.round(rect.height * devicePixelRatio);
                ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
                w = rect.width; h = rect.height;
            }
            function draw(){
                ctx.clearRect(0,0,canvas.width,canvas.height);
                // 背景纯色
                ctx.fillStyle = 'rgba(11,16,32,0.8)';
                ctx.fillRect(0,0,w,h);

                // 多条正弦波模拟脑电波
                const lines = 3;
                for(let i=0;i<lines;i++){
                    const amp = 18 + i*8;
                    const freq = 0.6 + i*0.3;
                    ctx.beginPath();
                    ctx.lineWidth = 2.0 - i*0.5;
                    ctx.strokeStyle = `rgba(53,197,197,${0.9 - i*0.25})`;
                    for(let x=0;x<=w;x+=4){
                        const y = h/2 + Math.sin((x/60)*freq + t*0.02 + i)*amp * Math.sin(t*0.005 + i);
                        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                    }
                    ctx.stroke();
                }
                t++;
                requestAnimationFrame(draw);
            }

            // 初始和监听
            function init(){
                resize();
                window.addEventListener('resize', ()=>{ resize(); });
                draw();
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
        })();
    </script>
</body>
</html>
